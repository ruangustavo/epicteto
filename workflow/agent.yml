# Copy to <target repo>/.github/workflows/agent.yml
name: agent

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      pr:
        description: PR number (leave empty for an implement run)
        required: false
        default: ""
      rerecord:
        description: Only replay the verification scripts and re-upload the video
        type: boolean
        default: false

permissions: {}

env:
  # Paths that count as UI: a diff touching them gets a verification video.
  UI_GLOBS: "apps/web/**"

jobs:
  resolve:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'agent' && github.event.sender.login == 'ruangustavo') ||
      (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' && github.event.sender.login == 'ruangustavo' && github.event.pull_request.user.login == 'ruan-agent-experiment[bot]')
    runs-on: [self-hosted, agent]
    outputs:
      issue: ${{ steps.ids.outputs.issue }}
      pr: ${{ steps.ids.outputs.pr }}
    steps:
      - id: ids
        env:
          EVENT: ${{ github.event_name }}
          ISSUE_FROM_EVENT: ${{ github.event.issue.number }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          case "$EVENT" in
            issues)              issue="$ISSUE_FROM_EVENT"; pr="" ;;
            pull_request_review) issue="$(printf '%s' "$HEAD_REF" | sed -nE 's#^agent/([0-9]+)-.*#\1#p')"; pr="$PR_FROM_EVENT" ;;
            workflow_dispatch)   issue="$INPUT_ISSUE"; pr="$INPUT_PR" ;;
          esac
          [ -n "$issue" ] || { echo "could not resolve issue number"; exit 1; }
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve
    concurrency:
      group: agent-${{ needs.resolve.outputs.issue }}
      cancel-in-progress: false
    runs-on: [self-hosted, agent]
    timeout-minutes: 90
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Run agent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_ID: ${{ secrets.APP_ID }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ needs.resolve.outputs.issue }}
          PR: ${{ needs.resolve.outputs.pr }}
          REVIEW_BODY: ${{ github.event.review.body }}
          UI_GLOBS: ${{ env.UI_GLOBS }}
          ATTACH_TOKEN: ${{ secrets.ATTACH_TOKEN }}
          RERECORD: ${{ inputs.rerecord }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: "$AGENT_HOME/bin/agent-run"
