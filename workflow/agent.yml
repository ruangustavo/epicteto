# Copy to <your repo>/.github/workflows/epicteto.yml and edit the three values under `env`.
# No secrets are needed here: the runner holds them.
name: epicteto

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        required: true
      pr:
        description: PR number (leave empty for an implement run)
        required: false
        default: ""
      rerecord:
        description: Only replay the verification scripts and re-upload the video
        type: boolean
        default: false

permissions: {}

env:
  # Who may trigger the agent (GitHub login) and the agent's own login (App slug + "[bot]").
  EPICTETO_OWNER: ruangustavo
  EPICTETO_BOT: ruan-agent-experiment[bot]
  # Paths that count as UI: a diff touching them gets a verification video. Empty disables video.
  UI_GLOBS: "apps/web/**"
  # Commands run inside the agent container, in order, stopping at the first failure.
  # The first one is setup and always runs. Leave empty for the Bun defaults.
  CHECKS: ""

jobs:
  resolve:
    runs-on: [self-hosted, epicteto]
    outputs:
      issue: ${{ steps.ids.outputs.issue }}
      pr: ${{ steps.ids.outputs.pr }}
      go: ${{ steps.ids.outputs.go }}
    steps:
      - id: ids
        env:
          EVENT: ${{ github.event_name }}
          SENDER: ${{ github.event.sender.login }}
          LABEL: ${{ github.event.label.name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEW_BODY: ${{ github.event.review.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          ISSUE_FROM_EVENT: ${{ github.event.issue.number }}
          PR_FROM_EVENT: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          INPUT_ISSUE: ${{ inputs.issue }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          go=false; issue=""; pr=""
          case "$EVENT" in
            issues)
              [ "$LABEL" = "agent" ] && [ "$SENDER" = "$EPICTETO_OWNER" ] && go=true
              issue="$ISSUE_FROM_EVENT" ;;
            pull_request_review)
              if [ "$SENDER" = "$EPICTETO_OWNER" ] && [ "$PR_AUTHOR" = "$EPICTETO_BOT" ]; then
                if [ "$REVIEW_STATE" = "changes_requested" ] || { [ "$REVIEW_STATE" = "commented" ] && [ -n "$REVIEW_BODY" ]; }; then go=true; fi
              fi
              issue="$(printf '%s' "$HEAD_REF" | sed -nE 's#^agent/([0-9]+)-.*#\1#p')"; pr="$PR_FROM_EVENT" ;;
            workflow_dispatch)
              go=true; issue="$INPUT_ISSUE"; pr="$INPUT_PR" ;;
          esac
          [ "$go" = true ] && [ -z "$issue" ] && { echo "could not resolve issue number"; exit 1; }
          echo "go=$go" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

  run:
    needs: resolve
    if: needs.resolve.outputs.go == 'true'
    concurrency:
      group: epicteto-${{ needs.resolve.outputs.issue }}
      cancel-in-progress: false
    runs-on: [self-hosted, epicteto]
    timeout-minutes: 90
    steps:
      - name: Run agent
        env:
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ needs.resolve.outputs.issue }}
          PR: ${{ needs.resolve.outputs.pr }}
          REVIEW_BODY: ${{ github.event.review.body }}
          RERECORD: ${{ inputs.rerecord }}
          UI_GLOBS: ${{ env.UI_GLOBS }}
          CHECKS: ${{ env.CHECKS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: "$AGENT_HOME/bin/agent-run"
