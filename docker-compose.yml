services:
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    image: epicteto-runner:local
    restart: unless-stopped
    env_file: .env
    environment:
      HOST_AGENT_DATA: ${HOST_AGENT_DATA}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_AGENT_DATA}:/agent-data
      - ${APP_PRIVATE_KEY_FILE}:/run/secrets/app-private-key.pem:ro
